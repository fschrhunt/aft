name: release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag (vX.Y.Z); use its tag ref unless retrying only the formula
        required: true
        type: string
      formula_only:
        description: Verify published downloads and retry only the formula; run from main
        type: boolean
        default: false

# Release preparation is disabled until the maintainer explicitly enables it.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    if: vars.RELEASE_ENABLED == 'true' && !inputs.formula_only && (github.event_name == 'push' || github.ref == format('refs/tags/{0}', inputs.tag))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          # Provenance must name the source actually built, including manual reruns.
          test "$sha" = "$(git rev-parse "$EVENT_SHA^{commit}")"
          printf 'tag=%s\nsha=%s\n' "$TAG" "$sha" >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: ./x check
      - run: ./x audit
      - name: Verify native release artifact
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: ./x release-check "$TAG"

  build:
    needs: [resolve, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and inspect four archives
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: ./x dist "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/${{ needs.resolve.outputs.tag }}/*
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Attest the checked artifacts without executing repository code with OIDC.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.tar.gz

  draft:
    needs: [resolve, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      # No repository code executes with the write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Verify release token availability and repository role
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN" || { echo '::error::RELEASE_TOKEN is unavailable to Aft.'; exit 1; }
          test "$(gh api "repos/$GH_REPO" --jq .permissions.push)" = true || {
            echo '::error::RELEASE_TOKEN does not report a repository write role for Aft.'
            exit 1
          }
      - name: Verify selected source and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$SOURCE_SHA"
          cd assets
          sha256sum --check checksums.txt
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes-file release-notes.md ./*.tar.gz checksums.txt

  install:
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && inputs.formula_only && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Verify and install the published native archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          case "$(uname -s)" in Darwin) os=darwin ;; Linux) os=linux ;; *) exit 1 ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64|amd64) arch=amd64 ;; *) exit 1 ;; esac
          archive="aft-$TAG-$os-$arch.tar.gz"
          work="$RUNNER_TEMP/aft-release-install"
          mkdir -p "$work"
          gh release download "$TAG" --pattern "$archive" --pattern checksums.txt --dir "$work"
          cd "$work"
          awk -v name="$archive" '$2 == name { print }' checksums.txt > selected-checksum.txt
          test "$(wc -l < selected-checksum.txt | tr -d ' ')" = 1
          if command -v sha256sum >/dev/null; then sha256sum --check selected-checksum.txt
          else shasum -a 256 --check selected-checksum.txt; fi
          tar -xzf "$archive" aft
          test -f aft && test ! -L aft
          test "$(./aft version)" = "aft $TAG"
          ./aft help >/dev/null

  formula:
    needs: install
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && inputs.formula_only && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: homebrew-formula
      cancel-in-progress: false
    steps:
      - name: Require the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          test -n "$RELEASE_TOKEN" || {
            echo '::error::Release authorization is unavailable.'
            exit 1
          }
      # Read main without persisting credentials; publish through a release PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Propose the Homebrew formula for the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          test "$TAG" = "$latest" || { echo 'Not the latest stable release; leaving the formula unchanged.'; exit 0; }
          gh release download "$TAG" --pattern checksums.txt --output "$RUNNER_TEMP/checksums.txt"
          python3 .github/release/formula.py "$TAG" "$RUNNER_TEMP/checksums.txt" > aft.rb
          python3 .github/release/formula_pr.py
