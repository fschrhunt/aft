version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    open-pull-requests-limit: 1
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    open-pull-requests-limit: 1
    allow:
      - dependency-type: all
